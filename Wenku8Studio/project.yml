name: Wenku8Studio
options:
  bundleIdPrefix: com.lightnovel
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.2"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: "arm64"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Wenku8Core:
    type: framework
    platform: macOS
    sources:
      - path: Sources/Wenku8Core
    settings:
      base:
        PRODUCT_NAME: Wenku8Core
        PRODUCT_BUNDLE_IDENTIFIER: com.lightnovel.Wenku8Core
        GENERATE_INFOPLIST_FILE: "YES"
        DEFINES_MODULE: "YES"
  Wenku8Studio:
    type: application
    platform: macOS
    sources:
      - path: Sources/Wenku8Studio
      - path: AppResources/Assets.xcassets
    dependencies:
      - target: Wenku8Core
      - sdk: WebKit.framework
    info:
      path: AppResources/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleDisplayName: Wenku8 Studio
        CFBundleName: Wenku8 Studio
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "2.3.0"
        CFBundleVersion: "4"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHighResolutionCapable: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_NAME: Wenku8Studio
        PRODUCT_BUNDLE_IDENTIFIER: com.lightnovel.Wenku8Studio
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
  Wenku8CoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Wenku8CoreTests
    dependencies:
      - target: Wenku8Core
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  Wenku8Studio:
    build:
      targets:
        Wenku8Studio: all
        Wenku8CoreTests: [test]
    test:
      targets:
        - Wenku8CoreTests
